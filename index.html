<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
     <!-- Aplica el tema guardado antes de pintar la página (evita parpadeo) -->
    <script>
      try {
        const guardado = localStorage.getItem("pista_tema");
        const prefiereOscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-bs-theme",
          guardado || (prefiereOscuro ? "dark" : "light")
        );
      } catch (error) {
        document.documentElement.setAttribute("data-bs-theme", "light");
      }
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

  </head>
<body>
<!-- Botón para cambiar entre modo claro y oscuro va denro de header
      <button class="boton boton--ghost boton--tema" id="btn-tema" aria-label="Cambiar a modo oscuro">🌙</button>

    <!-- PIE DE PÁGINA (Bootstrap) -->
<footer class="py-4 px-3 text-center border-top border-2 border-dark">
  © 2026 Hackathon Generation.
</footer>
    <!-- SCRIPTS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
